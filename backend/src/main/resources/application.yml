spring:
  application:
    name: zivro-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${ZIVRO_DB_URL:jdbc:mysql://localhost:3306/zivro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ZIVRO_DB_USER:root}
    password: ${ZIVRO_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

zivro:
  razorpay:
    enabled: ${ZIVRO_RAZORPAY_ENABLED:false}
    key-id: ${ZIVRO_RAZORPAY_KEY_ID:}
    key-secret: ${ZIVRO_RAZORPAY_KEY_SECRET:}
    webhook-secret: ${ZIVRO_RAZORPAY_WEBHOOK_SECRET:}
    deposit-fraction: ${ZIVRO_RAZORPAY_DEPOSIT_FRACTION:0.25}
    require-paid-before-accept: ${ZIVRO_RAZORPAY_REQUIRE_DEPOSIT_BEFORE_ACCEPT:true}
  bootstrap-admin:
    email: ${ZIVRO_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${ZIVRO_BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${ZIVRO_BOOTSTRAP_ADMIN_NAME:Admin}
  cloudinary:
    enabled: ${ZIVRO_CLOUDINARY_ENABLED:false}
    cloud-name: ${ZIVRO_CLOUDINARY_CLOUD_NAME:}
    api-key: ${ZIVRO_CLOUDINARY_API_KEY:}
    api-secret: ${ZIVRO_CLOUDINARY_API_SECRET:}
    upload-folder: ${ZIVRO_CLOUDINARY_FOLDER:zivro}
  jwt:
    # HS256: use at least 32 bytes in production (set ZIVRO_JWT_SECRET).
    secret: ${ZIVRO_JWT_SECRET:zivro-dev-hmac-secret-key-min-32-chars!!}
    expiration-ms: ${ZIVRO_JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated production origins, e.g. https://zivro.vercel.app
    allowed-origins: ${ZIVRO_CORS_ORIGINS:}

server:
  port: ${PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
